# jr-delay — delay 数据纯静态 Worker（仅资产，无 Worker 脚本，零计费）
# 由 ooep/delay 仓库的烘焙 workflow 同步 JSON 到此仓库 assets/data/，
# 本仓库 push 即触发 deploy.yml 部署（wrangler 按内容哈希增量，秒级跳过）。
# URL 形态: https://jr-delay.suki.ing/data/delays.json（主站消费）
# CORS 由 assets 根 _headers 提供（平台层应用，同样零 Worker 调用）。

name = "jr-delay"
compatibility_date = "2026-10-13"

[assets]
directory = "./assets"
not_found_handling = "404-page"

routes = [
  { pattern = "jr-delay.suki.ing/*", zone_name = "suki.ing" },
]
